# Codemagic build config for How Far Can You Hit It?
# Place at the repo root. Codemagic reads this file when the repo is connected.

workflows:
  ios-first-build:
    name: iOS First Build (Simulator, no signing)
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Decode sprite assets
        script: |
          python3 <<'PYEOF'
          import base64, json, os
          src = 'Sprites'
          out_base = 'Assets.xcassets'
          count = 0
          for fn in sorted(os.listdir(src)):
              if not fn.endswith('.base64.txt'):
                  continue
              name = fn[:-len('.base64.txt')]
              data = base64.b64decode(open(os.path.join(src, fn)).read())
              d = os.path.join(out_base, f'{name}.imageset')
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, f'{name}.png'), 'wb') as f:
                  f.write(data)
              contents = {"images": [{"idiom": "universal", "filename": f"{name}.png", "scale": "1x"}],
                          "info": {"version": 1, "author": "xcode"}}
              with open(os.path.join(d, 'Contents.json'), 'w') as f:
                  json.dump(contents, f, indent=2)
              count += 1
          print(f'decoded {count} sprite assets')
          PYEOF
      - name: Build for simulator (compilation check, no signing needed)
        script: |
          xcodebuild -project HowFarCanYouHitIt.xcodeproj \
            -scheme HowFarCanYouHitIt \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

  # ------------------------------------------------------------------
  # TESTFLIGHT WORKFLOW — prerequisites before running:
  # 1. App record, 3 in-app purchases, and Game Center leaderboard exist
  #    in App Store Connect (see AppStore/app-store-connect-setup.md).
  # 2. An App Store Connect API key is added in Codemagic as the
  #    "app_store_connect" environment variable group (App settings >
  #    Environment variables): APP_STORE_CONNECT_KEY_IDENTIFIER,
  #    APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY.
  #    Never paste keys into chat or into this file.
  # 3. stubMode is set to false in Sources/StoreManager.swift.
  # ------------------------------------------------------------------
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - app_store_connect
    scripts:
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.tntfamily.howfar \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Fix export options for current Xcode
        script: |
          python3 <<'PYEOF'
          import plistlib, os
          p = os.path.expanduser('~/export_options.plist')
          with open(p, 'rb') as f:
              opts = plistlib.load(f)
          opts['method'] = 'app-store-connect'
          opts['signingCertificate'] = 'Apple Distribution'
          with open(p, 'wb') as f:
              plistlib.dump(opts, f)
          print('export options updated')
          PYEOF
      - name: Generate app icons
        script: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          cp AppStore/app-icon.png Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -z 40 40 AppStore/app-icon.png --out Assets.xcassets/AppIcon.appiconset/AppIcon-20@2x.png
          sips -z 60 60 AppStore/app-icon.png --out Assets.xcassets/AppIcon.appiconset/AppIcon-20@3x.png
          sips -z 58 58 AppStore/app-icon.png --out Assets.xcassets/AppIcon.appiconset/AppIcon-29@2x.png
          sips -z 87 87 AppStore/app-icon.png --out Assets.xcassets/AppIcon.appiconset/AppIcon-29@3x.png
          sips -z 80 80 AppStore/app-icon.png --out Assets.xcassets/AppIcon.appiconset/AppIcon-40@2x.png
          sips -z 120 120 AppStore/app-icon.png --out Assets.xcassets/AppIcon.appiconset/AppIcon-40@3x.png
          sips -z 120 120 AppStore/app-icon.png --out Assets.xcassets/AppIcon.appiconset/AppIcon-60@2x.png
          sips -z 180 180 AppStore/app-icon.png --out Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png
      - name: Decode sprite assets
        script: |
          python3 <<'PYEOF'
          import base64, json, os
          src = 'Sprites'
          out_base = 'Assets.xcassets'
          count = 0
          for fn in sorted(os.listdir(src)):
              if not fn.endswith('.base64.txt'):
                  continue
              name = fn[:-len('.base64.txt')]
              data = base64.b64decode(open(os.path.join(src, fn)).read())
              d = os.path.join(out_base, f'{name}.imageset')
              os.makedirs(d, exist_ok=True)
              with open(os.path.join(d, f'{name}.png'), 'wb') as f:
                  f.write(data)
              contents = {"images": [{"idiom": "universal", "filename": f"{name}.png", "scale": "1x"}],
                          "info": {"version": 1, "author": "xcode"}}
              with open(os.path.join(d, 'Contents.json'), 'w') as f:
                  json.dump(contents, f, indent=2)
              count += 1
          print(f'decoded {count} sprite assets')
          PYEOF
      - name: Archive app
        script: |
          xcodebuild -project HowFarCanYouHitIt.xcodeproj \
            -scheme HowFarCanYouHitIt \
            -archivePath build/ios/xcarchive/HowFarCanYouHitIt.xcarchive \
            archive
      - name: Export IPA
        script: |
          echo "--- export options before ---"
          cat ~/export_options.plist || true
          echo "--- keychain identities ---"
          security find-identity -v -p codesigning || true
          echo "--- archived app signature ---"
          codesign -dv "build/ios/xcarchive/HowFarCanYouHitIt.xcarchive/Products/Applications/HowFarCanYouHitIt.app" || true
          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | awk -F'"' '/Apple Distribution|iPhone Distribution/ {print $2; exit}')
          echo "--- using certificate ---"
          echo "$IDENTITY"
          CERT_NAME="$IDENTITY" python3 <<'PYEOF'
          import plistlib, os
          p = os.path.expanduser('~/export_options.plist')
          with open(p, 'rb') as f:
              opts = plistlib.load(f)
          opts['method'] = 'app-store-connect'
          cert = os.environ.get('CERT_NAME') or 'Apple Distribution'
          opts['signingCertificate'] = cert
          with open(p, 'wb') as f:
              plistlib.dump(opts, f)
          print('export signingCertificate set to:', cert)
          PYEOF
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/HowFarCanYouHitIt.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$HOME/export_options.plist"
      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path $(find build/ios/ipa -name "*.ipa" | head -1)
